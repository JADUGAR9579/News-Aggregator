name: Deploy to GitHub Pages

# Builds and deploys the app to GitHub Pages on every push to main.
# Uses the official actions/deploy-pages flow (no gh-pages branch, no
# extra npm dependency) -- must be enabled once in the repo under
# Settings > Pages > Source > "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      - name: Build
        # VITE_BASE_PATH must match /<repo-name>/ for a project site
        # (https://<user>.github.io/<repo-name>/). If this repo is deployed
        # as a user/org site (https://<user>.github.io/) or behind a custom
        # domain instead, set this to "/" -- see README > Deployment.
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_NEWS_API_KEY: ${{ secrets.VITE_NEWS_API_KEY }}
          VITE_NEWS_API_BASE_URL: ${{ secrets.VITE_NEWS_API_BASE_URL }}
          VITE_SUMMARY_API_KEY: ${{ secrets.VITE_SUMMARY_API_KEY }}
          VITE_SUMMARY_API_URL: ${{ secrets.VITE_SUMMARY_API_URL }}
          VITE_WEATHER_API_KEY: ${{ secrets.VITE_WEATHER_API_KEY }}
          VITE_WEATHER_API_URL: ${{ secrets.VITE_WEATHER_API_URL }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>News Aggregator | Your World, One Feed</title>
    <meta
      name="description"
      content="A modern news aggregator delivering breaking news, trending stories, and personalized feeds from around the world."
    />
    <meta name="theme-color" content="#3660ff" />

    <!-- Open Graph -->
    <meta property="og:title" content="News Aggregator | Your World, One Feed" />
    <meta
      property="og:description"
      content="Breaking news, trending stories, and a personalized feed — all in one place."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%BASE_URL%logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="News Aggregator | Your World, One Feed" />
    <meta
      name="twitter:description"
      content="Breaking news, trending stories, and a personalized feed — all in one place."
    />
    <meta name="twitter:image" content="%BASE_URL%logo.png" />

    <!-- PWA -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- GitHub Pages SPA routing workaround, decoder half -- see public/404.html
         for the encoder half and README > Deployment for why this exists.
         A no-op on every other host: it only does anything when the query
         string actually contains the "?/" marker 404.html would have added. -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

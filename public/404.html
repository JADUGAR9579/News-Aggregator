<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>News Aggregator</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages serves this file for any URL that doesn't match a real
      // file (i.e. every client-side route, since there's no server to
      // rewrite them to index.html). It re-encodes the path the visitor
      // actually wanted into a query string and redirects to the real
      // index.html, which decodes it back via the matching script there --
      // before React Router mounts, so the visitor lands on the right page.
      var segmentCount = 1; // matches the depth of VITE_BASE_PATH, e.g. /news-aggregator/
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + segmentCount)
            .join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
